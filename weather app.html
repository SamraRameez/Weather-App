<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather App</title>

    <style>
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #0f172a, #1e293b);
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .container {
            background: #1e293b;
            padding: 25px;
            border-radius: 15px;
            width: 350px;
            text-align: center;
            box-shadow: 0 0 20px rgba(0,0,0,0.4);
        }

        h1{
            margin-bottom: 20px;
            color: #38bdf8;
        }

        .search-box{
            display: flex;
            gap: 10px;
        }

        input {
            flex: 1;
            padding: 10px;
            border-radius: 8px;
            border: none;
            outline: none;
            font-size: 16px;
        }

        button {
            padding: 10px 15px;
            border: none;
            background: #3b82f6;
            color: white;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
            transition: 0.3s;
        }

        button:hover{
            background: #2563eb;
        }

        .weather {
            margin-top: 20px;
            font-size: 20px;
            line-height: 1.6;
        }

    </style>
</head>
<body>

    <div class="container">

        <h1>Weather App</h1>

        <div class="search-box">
            <input type="text" placeholder="Enter city name">
            <button>Search</button>
        </div>

        <div class="weather">
            <h3></h3>
        </div>

    </div>

<script>

    let input = document.querySelector("input");
    let btn = document.querySelector("button");
    let text = document.querySelector("h3");

    btn.addEventListener("click", () => {

        let cityName = input.value;

        fetch(`https://api.openweathermap.org/data/2.5/weather?q=${cityName}&appid=560dc8bfa2794a7872a2c953177e7dd9&units=metric`)
        
        .then(response => response.json())

        .then(data => {

            if(data.cod == "404"){
                text.textContent = "City not found";
            }
            else{
                text.textContent = `Current temperature of ${data.name} is ${data.main.temp}°C`;
            }

        })

        .catch(() => {
            text.textContent = "Error fetching weather data";
        });

    });

</script>

</body>
</html>
